<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>现代都市全球节点图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081827;color:#d8f3ff;font:14px system-ui}header{padding:12px 16px;background:#102b40;border-bottom:1px solid #24566e}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}.toolbar label{display:flex;align-items:center;gap:5px}.toolbar select,.toolbar button{border:1px solid #3788a5;border-radius:6px;background:#10334a;color:#d8f3ff;padding:5px 8px}.toolbar select{max-width:180px}#map{height:620px;min-height:420px;background:linear-gradient(145deg,#0d2639,#153d51);color:#d8f3ff}#map .node-label{display:none}#map .node-city .node-label,#map .map-node:hover .node-label{display:block}#detail{padding:12px 18px;background:#102b40;line-height:1.65;min-height:84px}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto;font-size:12px;color:#bce9f8}.legend span{white-space:nowrap}@media(max-width:720px){#map{height:520px}.legend{width:100%;margin-left:0}.toolbar select{max-width:130px}}
</style>
<header>
  <strong id="title"></strong>
  <div class="toolbar">
    <label>起点 <select id="route-from"></select></label>
    <label>终点 <select id="route-to"></select></label>
    <label>优化
      <select id="criterion">
        <option value="time">时间</option>
        <option value="cost">费用</option>
        <option value="risk">风险</option>
      </select>
    </label>
    <button id="zoom-in" type="button">放大</button>
    <button id="zoom-out" type="button">缩小</button>
    <button id="reset-view" type="button">复位</button>
    <div id="legend" class="legend"></div>
  </div>
</header>
<main id="map"></main>
<aside id="detail">彩色细线为交通拓扑，橙线为当前规划路线。选择城市或城区可查看详细信息。</aside>
<script type="module">
import { MODERN_MAP as data } from './modern_mapdata.js';
import { getNodeIcon, mountWorldMap } from './dist/V20260728/world-map-core.js';

const mapElement = document.getElementById('map');
const detailElement = document.getElementById('detail');
const fromSelect = document.getElementById('route-from');
const toSelect = document.getElementById('route-to');
document.getElementById('title').textContent = data.title;

for (const node of data.nodes) {
  for (const select of [fromSelect, toSelect]) {
    const option = document.createElement('option');
    option.value = node.id;
    option.textContent = `${getNodeIcon(node.type)} ${node.name}`;
    select.append(option);
  }
}
toSelect.selectedIndex = Math.min(1, data.nodes.length - 1);

const readWorldState = () => {
  try {
    return parent?.DNFFiveWorldState?.世界状态?.现代都市 || {};
  } catch {
    return {};
  }
};
const controller = mountWorldMap({
  container: mapElement,
  detail: detailElement,
  map: data,
  getState: readWorldState,
  onSpawnSelected(nodeId) {
    const node = data.nodes.find(item => item.id === nodeId);
    if (!node) return;
    parent.postMessage({
      channel: 'modern-spawn-map',
      type: 'modern_spawn_selected',
      spawn: {
        id: node.id,
        节点ID: node.id,
        名称: node.name,
        大陆: node.大陆 || '',
        层级: node.层级 || '',
        区域: node.区域 || node.name,
        场所: node.场所 || node.name,
        地区等级: node.地区等级 || '',
        危险等级: node.危险等级 || '',
        地貌特征: node.地貌特征 || '',
        聚落描述: node.聚落描述 || node.summary || '',
        周边威胁: node.周边威胁 || '',
        地点类型: node.地点类型 || node.type || '',
        地图层级: typeof node.地图层级 === 'number' ? node.地图层级 : 0,
        type: node.type || ''
      }
    }, '*');
  }
});

const updateRoute = () => controller.setRoute(fromSelect.value, toSelect.value);
fromSelect.addEventListener('change', updateRoute);
toSelect.addEventListener('change', updateRoute);
document.getElementById('criterion').addEventListener('change', event => {
  controller.setCriterion(event.target.value);
  updateRoute();
});
document.getElementById('zoom-in').addEventListener('click', () => controller.zoomIn());
document.getElementById('zoom-out').addEventListener('click', () => controller.zoomOut());
document.getElementById('reset-view').addEventListener('click', () => controller.resetView());

const legendTypes = [...new Set(data.nodes.map(node => node.type))];
document.getElementById('legend').innerHTML = legendTypes
  .map(type => `<span>${getNodeIcon(type)} ${type}</span>`)
  .join('');
updateRoute();
parent.postMessage({ channel: 'modern-spawn-map', type: 'map_ready' }, '*');
</script>
</html>
