name: Apply map and gender fixes

on:
  push:
    branches:
      - fix/map-gender-interactions-20260731
    paths:
      - .github/workflows/apply-map-gender-fixes.yml
      - scripts/apply-map-gender-fixes.py
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/map-gender-interactions-20260731'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/map-gender-interactions-20260731
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify new tests fail before production changes
        shell: bash
        run: |
          set +e
          node --test tests/opening-companion-compat.test.mjs
          companion_status=$?
          node --test tests/world-map-core.test.mjs
          map_status=$?
          python -m unittest tests/opening_ui_regression_test.py
          opening_status=$?
          set -e
          echo "RED statuses: companion=${companion_status}, map=${map_status}, opening=${opening_status}"
          if [ "$companion_status" -eq 0 ] || [ "$map_status" -eq 0 ] || [ "$opening_status" -eq 0 ]; then
            echo "Expected each focused regression suite to fail before implementation."
            exit 1
          fi

      - name: Apply production fixes
        run: python scripts/apply-map-gender-fixes.py

      - name: Regenerate dual-world assets
        run: node scripts/build-dual-world-assets.mjs --phase final

      - name: Run focused regression tests
        run: |
          node --test tests/opening-companion-compat.test.mjs
          node --test tests/world-map-core.test.mjs
          python -m unittest tests/opening_ui_regression_test.py

      - name: Run repository-contained JavaScript tests
        shell: bash
        run: |
          mapfile -d '' test_files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'high-density-baseline.test.mjs' -print0)
          node --test "${test_files[@]}"

      - name: Run repository-contained Python tests
        shell: bash
        run: |
          mapfile -d '' test_files < <(find tests -maxdepth 1 -name '*test.py' ! -name 'high_density_worldbook_test.py' ! -name 'opening_runtime_test.py' -print0)
          python -m unittest "${test_files[@]}"

      - name: Validate generated data contract
        run: node scripts/build-dual-world-assets.mjs --phase final --check

      - name: Commit verified changes
        shell: bash
        run: |
          rm scripts/apply-map-gender-fixes.py
          rm .github/workflows/apply-map-gender-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: enable map gestures and custom gender profiles"
          git push origin HEAD:fix/map-gender-interactions-20260731
