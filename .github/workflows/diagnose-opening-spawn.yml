name: Apply opening spawn selection fix

on:
  push:
    branches:
      - fix/opening-spawn-selection-20260731
    paths:
      - .github/workflows/diagnose-opening-spawn.yml
      - scripts/diagnose-opening-spawn.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/opening-spawn-selection-20260731
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify regression test fails before production change
        shell: bash
        run: |
          set +e
          python tests/opening_ui_regression_test.py
          status=$?
          set -e
          echo "RED status=${status}"
          if [ "$status" -eq 0 ]; then
            echo "Expected the modern spawn regression test to fail before implementation."
            exit 1
          fi

      - name: Apply production fix
        run: python scripts/diagnose-opening-spawn.py

      - name: Run focused regression tests
        run: python tests/opening_ui_regression_test.py

      - name: Run repository-contained JavaScript tests
        shell: bash
        run: |
          for file in tests/*.test.mjs; do
            case "$file" in
              tests/high-density-baseline.test.mjs) continue ;;
            esac
            node --test "$file"
          done

      - name: Run repository-contained Python tests
        shell: bash
        run: |
          for file in tests/*test.py; do
            case "$file" in
              tests/high_density_worldbook_test.py|tests/opening_runtime_test.py) continue ;;
            esac
            python "$file"
          done

      - name: Commit verified changes
        shell: bash
        run: |
          rm scripts/diagnose-opening-spawn.py
          rm .github/workflows/diagnose-opening-spawn.yml
          rm -rf tests/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve selected modern spawn location"
          git push origin HEAD:fix/opening-spawn-selection-20260731
