name: Modern map node selection

on:
  pull_request:
    paths:
      - modern_map.html
      - dist/V20260728/world-map-core.js
      - tests/world-map-core.test.mjs
      - scripts/apply-modern-map-node-selection-fix.py
      - .github/workflows/modern-map-node-selection.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/modern-map-node-selection-20260731
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production fix
        run: python scripts/apply-modern-map-node-selection-fix.py
      - name: Run focused map tests
        run: node --test tests/world-map-core.test.mjs
      - name: Commit verified fix
        shell: bash
        run: |
          rm scripts/apply-modern-map-node-selection-fix.py
          rm .github/workflows/modern-map-node-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: forward modern map node selections"
          git push origin HEAD:fix/modern-map-node-selection-20260731
